<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Approve this post</title>
<link rel="stylesheet" href="/report.css?v=social1">
</head>
<body class="rp-page">
<div id="root"><div class="rp-state">Loading…</div></div>
<script src="/social-icons.js?v=1"></script>
<script src="/approval.js?v=social1"></script>
<script>
(async function () {
  const root = document.getElementById('root');
  const token = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  async function load() {
    try {
      const r = await fetch('/api/public/approval/' + encodeURIComponent(token), { headers: { Accept: 'application/json' } });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'This link is not available.');
      window.renderApproval(root, d, token, load);
    } catch (e) {
      root.innerHTML = '<div class="rp-state"><h1 style="font-size:22px;margin:0 0 8px">Link not available</h1><p></p></div>';
      root.querySelector('p').textContent = e.message || 'This approval link is no longer active.';
    }
  }
  load();
})();
</script>
</body>
</html>
