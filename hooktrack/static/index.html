<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HookTrack app</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css?v=ui2">
<script src="/cookie-consent.js"></script>
<!-- Shotstack Studio (the in-app video/photo editor): a prebuilt bundle (studio-build/, esbuild) rather than
     a CDN import map - that resolved every dependency (pixi.js included) to one deterministic copy, where
     jsdelivr's own ESM resolution could not guarantee that and caused real rendering bugs. Loaded as a plain
     global, not a module, so it costs nothing until a studio page actually reads window.HookTrackStudioBundle. -->
<script src="/studio-bundle.js?v=1" defer></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
  <aside id="sidebar" class="sidebar">
    <div class="brand"><span class="logo"><img src="/logo-mark.svg" alt="" width="30" height="30"></span> HookTrack</div>
    <!-- Ordered as the actual work flows: see what's scoring (Hooks) -> find fresh ideas (Discover) ->
         plan/film/schedule them (Posts) -> the accounts that feed all of it -> engage (Inbox) -> report
         out (Clients) -> configure (Settings, always last). Not alphabetical, not historical. -->
    <nav id="nav">
      <a href="#/dashboard" data-tab="dashboard">Dashboard</a>
      <a href="#/hooks" data-tab="hooks">Hooks</a>
      <a href="#/discover" data-tab="discover">Discover</a>
      <a href="#/pipeline" data-tab="pipeline">Posts</a>
      <a href="#/accounts" data-tab="accounts">Accounts</a>
      <a href="#/inbox" data-tab="inbox">Inbox</a>
      <a href="#/clients" data-tab="clients">Clients</a>
      <a href="#/settings" data-tab="settings">Settings</a>
    </nav>
  </aside>
  <div class="app-main">
    <header class="top">
      <button type="button" id="sidebar-toggle" class="icon-btn sidebar-toggle" aria-label="Menu">☰</button>
      <div class="top-right"><a href="#/settings" id="ai-badge" class="badge" title="" style="text-decoration:none"></a>
        <select id="ws-switch" aria-label="Workspace"></select>
        <span id="user-email" class="muted small"></span><button class="btn sm" id="logout">Sign out</button></div>
    </header>
    <div id="verifybar" hidden></div>
    <div id="trialbar" hidden></div>
    <main id="app"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<link rel="stylesheet" href="/report.css?v=1">
<link rel="stylesheet" href="/assistant.css?v=1">
<script src="/report.js?v=1"></script>
<script src="/app.js?v=ui2"></script>
<script src="/assistant.js?v=1"></script>
<script src="/demo-player.js?v=1" defer></script>
</body>
</html>
