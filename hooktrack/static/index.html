<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HookTrack app</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css?v=team-review1">
<script src="/cookie-consent.js"></script>
<!-- Shotstack Studio (the in-app video/photo editor): a prebuilt bundle (studio-build/, esbuild) rather than
     a CDN import map - that resolved every dependency (pixi.js included) to one deterministic copy, where
     jsdelivr's own ESM resolution could not guarantee that and caused real rendering bugs. Loaded as a plain
     global, not a module, so it costs nothing until a studio page actually reads window.HookTrackStudioBundle. -->
<script src="/studio-bundle.js?v=1" defer></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
  <aside id="sidebar" class="sidebar">
    <div class="brand"><span class="logo"><img src="/logo-mark.svg" alt="" width="30" height="30"></span><span class="brand-name">HookTrack</span></div>
    <!-- Accounts stay near the top for quick access; the remaining links follow the content workflow. -->
    <nav id="nav" aria-label="Main navigation">
      <div class="nav-group">
        <span class="nav-label">Overview</span>
        <a href="#/dashboard" data-tab="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
      </div>
      <div class="nav-group">
        <span class="nav-label">Create &amp; manage</span>
        <a href="#/accounts" data-tab="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1.5a7 7 0 0 1 14 0V20z"/></svg><span>Accounts</span></a>
        <a href="#/hooks" data-tab="hooks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5a3.5 3.5 0 0 1 6.8-1.1L13 12h5a6.5 6.5 0 0 1-12.8 1.7L9 4.5z"/></svg><span>Hooks</span></a>
        <a href="#/discover" data-tab="discover"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5M10.8 7.5v6.6M7.5 10.8h6.6"/></svg><span>Discover</span></a>
        <a href="#/pipeline" data-tab="pipeline"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="16.5" y="4" width="4" height="13" rx="1.5"/></svg><span>Posts</span></a>
      </div>
      <div class="nav-group">
        <span class="nav-label">Engage</span>
        <a href="#/inbox" data-tab="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="m4.5 7 7.5 6 7.5-6M4 15h4l1.5 2h5L16 15h4"/></svg><span>Inbox</span></a>
        <a href="#/clients" data-tab="clients"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1a5.5 5.5 0 0 1 11 0v1zM16 5.5a3 3 0 0 1 0 5.8M17 14a4.5 4.5 0 0 1 3.5 4.4v.6"/></svg><span>Clients</span></a>
      </div>
      <div class="nav-group nav-group-bottom">
        <span class="nav-label">Workspace</span>
        <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3z"/></svg><span>Settings</span></a>
      </div>
    </nav>
  </aside>
  <div class="app-main">
    <header class="top">
      <button type="button" id="sidebar-toggle" class="icon-btn sidebar-toggle" aria-label="Open navigation" aria-expanded="true" title="Collapse navigation">☰</button>
      <div class="top-right">
        <div id="utility-search" class="utility-search" aria-label="App search"></div>
        <div id="top-utilities" class="top-utilities" aria-label="Quick tools"></div>
        <span class="utility-divider" aria-hidden="true"></span>
        <label class="workspace-picker" for="ws-switch">
          <span class="workspace-label">Workspace</span>
          <span class="workspace-select-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3"></rect><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01"></path></svg>
            <select id="ws-switch" aria-label="Workspace"></select>
          </span>
        </label>
        <a href="#/settings" id="ai-badge" class="badge" title="" style="text-decoration:none"></a>
        <div class="account-tools">
          <span class="account-avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg></span>
          <span id="user-email" class="muted small"></span>
          <button class="btn sm" id="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3"></path><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path></svg><span>Sign out</span></button>
        </div>
      </div>
    </header>
    <div id="verifybar" hidden></div>
    <div id="trialbar" hidden></div>
    <main id="app"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<link rel="stylesheet" href="/report.css?v=social1">
<link rel="stylesheet" href="/assistant.css?v=1">
<script src="/social-icons.js?v=1"></script>
<script src="/report.js?v=social1"></script>
<script src="/app.js?v=team-review1"></script>
<script src="/assistant.js?v=1"></script>
<script src="/demo-player.js?v=1" defer></script>
</body>
</html>
