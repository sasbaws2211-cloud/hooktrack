<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HookTrack app</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css?v=logo1">
<script src="/cookie-consent.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"><img src="/logo-mark.svg" alt="" width="30" height="30"></span> HookTrack</div>
  <nav id="nav">
    <a href="#/dashboard" data-tab="dashboard">Dashboard</a>
    <a href="#/accounts" data-tab="accounts">Accounts</a>
    <a href="#/clients" data-tab="clients">Clients</a>
    <a href="#/hooks" data-tab="hooks">Hooks</a>
    <a href="#/pipeline" data-tab="pipeline">Posts</a>
    <a href="#/inspiration" data-tab="inspiration">Inspiration</a>
    <a href="#/settings" data-tab="settings">Settings</a>
  </nav>
  <div class="top-right"><a href="#/settings" id="ai-badge" class="badge" title="" style="text-decoration:none"></a>
    <select id="ws-switch" aria-label="Workspace"></select>
    <span id="user-email" class="muted small"></span><button class="btn sm" id="logout">Sign out</button></div>
</header>
<div id="verifybar" hidden></div>
<div id="trialbar" hidden></div>
<main id="app"></main>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<link rel="stylesheet" href="/report.css?v=1">
<link rel="stylesheet" href="/assistant.css?v=1">
<script src="/report.js?v=1"></script>
<script src="/app.js?v=logo1"></script>
<script src="/assistant.js?v=1"></script>
</body>
</html>
